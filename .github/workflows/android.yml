name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (packet forwarder)
        run: ./gradlew :core:test --no-daemon

      - name: Build APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: DataRoute-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: core/build/reports/tests

  # Runs the real APK on an Android 16 emulator shaped like a Galaxy S26 Ultra
  # (1440x3120 QHD+ panel at 600 dpi = the same 384dp layout width as the phone's default display settings).
  # This is a stock Android image: it checks our app on that screen and OS version, not Samsung's One UI.
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # to commit the screenshots back to docs/screenshots on this branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon

      - name: Run on "Galaxy S26 Ultra" emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          avd-name: galaxy_s26_ultra_profile
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb shell wm size 1440x3120
            adb shell wm density 600
            adb shell getprop ro.build.version.release
            ./gradlew :app:connectedDebugAndroidTest --no-daemon || touch tests_failed
            mkdir -p emulator-screens && adb pull /data/local/tmp/dataroute-screens/. emulator-screens/ || true
            test ! -f tests_failed

      # Keeps the latest screenshots browsable in the repo (pushes made with GITHUB_TOKEN don't trigger CI again).
      - name: Commit screenshots to docs/screenshots
        if: always() && github.event_name == 'push'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          [ -n "$(ls -A emulator-screens 2>/dev/null)" ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin "$BRANCH" && git checkout -q -B screens "origin/$BRANCH"
            rm -rf docs/screenshots && mkdir -p docs/screenshots && cp emulator-screens/*.png docs/screenshots/
            git add docs/screenshots
            git diff --cached --quiet && exit 0
            git commit -q -m "Emulator screenshots for ${GITHUB_SHA::7} [skip ci]"
            git push -q origin "HEAD:$BRANCH" && exit 0
            sleep $((attempt * 5))
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screenshots
          path: emulator-screens
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-test-report
          path: app/build/reports/androidTests/connected
          if-no-files-found: warn
